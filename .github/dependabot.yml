version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '12:00'
      timezone: 'Europe/Brussels'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) drops typescript/lib/tsc, which vue-tsc still loads.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Peer-pinned to the vitest that vite-plus bundles: bump it together with vite-plus, never alone.
      - dependency-name: '@vitest/coverage-v8'
    groups:
      # Vite+ ships its own oxc/rolldown/vitest binaries; bump the CLI and its platform packages together.
      # A bump also needs the `overrides.vite` pin (vite-plus-core) and @vitest/coverage-v8 moved by hand.
      vite-plus:
        patterns:
          - 'vite-plus'
          - '@voidzero-dev/*'
      capacitor:
        patterns:
          - '@capacitor/*'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '12:00'
      timezone: 'Europe/Brussels'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
