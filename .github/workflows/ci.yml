name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Vite+ check (format, lint, type check)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Run vp check
        run: vp check

  typecheck:
    name: Typecheck (vue-tsc)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      # vue-tsc also checks Vue templates, which vp check does not.
      - name: Typecheck
        run: vp exec nuxi typecheck

  test:
    name: Tests (coverage)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      # Unit + Nuxt-environment tests with coverage; fails if a coverage threshold in vite.config.ts is not met.
      # No secrets and no network: the Nuxt project boots on dummy runtime config (tests/support/nuxtProject.ts).
      - name: Run vp test with coverage
        run: vp test run --coverage

  build:
    name: Build
    runs-on: ubuntu-26.04
    env:
      DASHBOARD_BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Build
        run: vp run build
