name: Security scan

# Daily audit of the production dependencies against the npm advisory
# database: fails on a high or critical advisory. Dependabot security updates
# open the fix PRs; "CI watch" posts a failure to Telegram.

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The npm that package.json devEngines asks for (older ones refuse to run).
      - name: npm audit (production dependencies)
        run: |
          set -euo pipefail
          npm_version=$(jq -r '.devEngines.packageManager.version // empty' package.json)
          npx -y "npm@${npm_version:-latest}" audit --omit=dev --audit-level=high
