name: Security scan

# Daily audit of the production dependencies against the npm advisory
# database: fails on a high or critical advisory that the allowlist does not
# cover. Dependabot security updates open the fix PRs; "CI watch" posts a failure to Telegram.

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # Its auto cache runs the runner's npm, which devEngines refuses.
          package-manager-cache: false

      # The npm that package.json devEngines asks for: older ones refuse to run
      # in the project, so it is installed from outside it.
      # Fails on a high or critical advisory, unless .github/audit-allowlist.json
      # lists its GHSA id with a reason and a review date that has not passed.
      - name: npm audit (production dependencies)
        run: |
          set -euo pipefail
          npm_version=$(jq -r '.devEngines.packageManager.version // empty' package.json)
          (cd "$RUNNER_TEMP" && npm install -g "npm@${npm_version:-latest}")
          npm --version
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          today=$(date -u +%F)
          jq -r '[.vulnerabilities[] | .via[] | objects | select(.severity == "high" or .severity == "critical")
                  | "\(.url | split("/") | last)\t\(.severity)\t\(.name)@\(.range)\t\(.title)"] | unique[]' \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/findings.tsv"
          allow='{}'
          [ -f .github/audit-allowlist.json ] && allow=$(cat .github/audit-allowlist.json)
          failed=0
          while IFS=$'\t' read -r id severity pkg title; do
            until=$(jq -r --arg id "$id" '.[$id].until // empty' <<<"$allow")
            if [ -n "$until" ] && [[ ! "$until" < "$today" ]]; then
              echo "allowed until $until: $id $severity $pkg ($(jq -r --arg id "$id" '.[$id].reason' <<<"$allow"))"
            else
              [ -n "$until" ] && echo "::error::$id: allowlist entry expired on $until, review it"
              echo "::error::$id $severity $pkg: $title"
              failed=1
            fi
          done < "$RUNNER_TEMP/findings.tsv"
          echo "$(wc -l < "$RUNNER_TEMP/findings.tsv" | tr -d ' ') high or critical advisories."
          exit "$failed"
